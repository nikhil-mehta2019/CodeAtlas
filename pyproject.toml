[project]
name = "codeatlas"
version = "0.1.0"
description = "AI Software Quality Agent — discovers, understands, and documents software repositories with evidence-backed findings."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pathspec>=0.12",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
codeatlas = "codeatlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeatlas"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
norecursedirs = ["tests/fixtures"]
